name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. إعداد Java 17 المطلوبة لـ Capacitor 6 و Gradle
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. تثبيت الحزم وبناء ملف CSS المحلي (بدون CDN)
      - name: Install dependencies & build CSS
        run: |
          npm install
          npm run build:css

      # 5. تجهيز منصة الأندرويد وتوليد الأيقونة وشاشة البداية
      - name: Prepare Android platform & assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0F6A4F' \
            --splashBackgroundColor '#0F6A4F'
          npx cap sync android

      # 6. تجميع ملف الـ APK التجريبي (Debug APK)
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. رفع ملف الـ APK لتحميله مباشرة من GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisbat-mughtarib-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
